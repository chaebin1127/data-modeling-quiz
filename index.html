x;flex:0 0 27px;border-radius:9px;background:#f3f4f8;color:#777d93;display:grid;place-items:center;font-size:12px;font-weight:800}.option.selected{border:1.5px solid var(--purple);background:#f8f7ff}.option.selected .letter{background:var(--purple);color:white}.option.correct{border-color:#54b88d;background:#f1fbf6}.option.correct .letter{background:#16845b;color:white}.option.wrong{border-color:#e38a97;background:#fff5f6}.option.wrong .letter{background:var(--red);color:white}.option:disabled{cursor:default}.feedback{display:none;margin-top:19px;padding:16px 18px;border-radius:14px;line-height:1.65;font-size:14px}.feedback.show{display:block}.feedback.good{background:#effaf5;color:#176b4d}.feedback.bad{background:#fff4f5;color:#983a4b}.feedback b{display:block;margin-bottom:4px}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:10px}.controls .right{display:flex;gap:9px}.controls button:disabled{opacity:.38;cursor:not-allowed}.hint{color:var(--muted);font-size:12px;margin-top:18px}.result{padding:45px;text-align:center}.result-icon{width:76px;height:76px;border-radius:25px;background:var(--purple2);color:var(--purple);display:grid;place-items:center;font-size:34px;margin:0 auto 18px}.result h2{font-size:32px;margin:0 0 9px;letter-spacing:-1px}.result>p{color:var(--muted);margin:0}.score{font-size:58px;font-weight:850;letter-spacing:-2px;margin:25px 0 4px}.score small{font-size:19px;color:var(--muted);letter-spacing:0}.result-stats{display:flex;justify-content:center;gap:12px;margin:25px 0 30px}.result-stats div{background:#f8f8fc;padding:14px 23px;border-radius:14px;min-width:105px}.result-stats b{display:block;font-size:20px}.result-stats span{font-size:11px;color:var(--muted)}.review{text-align:left;margin-top:30px;border-top:1px solid var(--line);padding-top:24px}.review h3{font-size:17px}.review-item{padding:15px 0;border-bottom:1px solid var(--line)}.review-item b{display:block;font-size:14px;line-height:1.5}.review-ite <script>

식별자", "보조식별자", "대리식별자"], "answer": 1, "explain": "둘 이상의 속성을 조합하여 인스턴스를 식별하므로 복합식별자야."}, {"category": "식별자 관계", "q": "자식 엔티티의 주식별자에 부모 엔티티의 식별자가 포함되는 관계는?", "options": ["비식별자 관계", "식별자 관계", "N:M 관계", "선택 관계"], "answer": 1, "explain": "부모의 식별자가 자식의 주식별자 일부로 사용되면 식별자 관계(Identifying Relationship)야."}, {"category": "식별자 관계", "q": "회원 엔티티의 회원번호가 주문 엔티티의 FK로만 존재하고 주문의 PK에는 포함되지 않는다면, 회원-주문 관계는?", "options": ["식별자 관계", "비식별자 관계", "복합식별자 관계", "N:M 관계"], "answer": 1, "explain": "부모의 식별자가 자식의 PK에 포함되지 않고 일반 FK로만 사용되므로 비식별자 관계야."}, {"category": "실전 ERD 해석", "q": "주문과 상품 사이의 N:M 관계를 해소하기 위해 주문상품 엔티티를 만들었다. 주문상품의 식별자를 주문번호+상품번호로 구성했다면 옳은 설명은?", "options": ["주문상품은 주문과 상품을 연결하는 교차 엔티티이며, 두 속성의 조합은 복합식별자다.", "주문상품은 속성이 없는 엔티티다.", "주문과 상품은 더 이상 관계가 없다.", "주문번호와 상품번호는 모두 일반 속성이다."], "answer": 0, "explain": "주문상품은 주문과 상품의 N:M 관계를 1:N 두 개로 해소하는 교차 엔티티야. 주문번호와 상품번호를 함께 PK로 쓰면 복합식별자야."}, {"category": "실전 ERD 해석", "q": "다음 중 식별자의 종류와 예시가 올바르게 연결된 것은?", "options": ["대리식별자 — 주민등록번호", "원조식별자 — 시스템에서 자동 생성한 일련번호", "단일식별자 — 학번 하나로 학생을 구분", "복합식별자 — 이메일 하나로 회원을 구분"], "answer": 2, "explain": "학번 하나로 학생을 구분하면 단일식별자야. 주민등록번호·사업자등록번호는 원조식별자, 시스템이 만든 자동 증가 ID는 대리식별자, 주문번호+상품번호는 복합식별자의 예야."}];
let index=0, selected=null, checked=false, answers=Array(questions.length).fill(null);
const $=id=>document.getElementById(id);
$("year").textContent=new Date().getFullYear();
function show(section){["intro","quiz","result"].forEach(id=>$(id).classList.toggle("hidden",id!==section));}
function start(){index=0;selected=null;checked=false;answers=Array(questions.length).fill(null);show("quiz");render();}
function render(){
 const q=questions[index];selected=answers[index];checked=!!(selected&&selected.checked);
 $("currentNo").textContent=String(index+1).padStart(2,"0");
 $("category").textContent=q.category;$("questionText").textContent=q.q;
 $("progressBar").style.width=((index+1)/questions.length*100)+"%";
 $("options").innerHTML="";
 q.options.forEach((opt,i)=>{
  const b=document.createElement("button");b.className="option";b.type="button";
  const letter=document.createElement("span");letter.className="letter";letter.textContent=String.fromCharCode(65+i);
  const text=document.createElement("span");text.textContent=opt;b.append(letter,text);
  if(selected&&selected.choice===i)b.classList.add("selected");
  if(checked){b.disabled=true;if(i===q.answer)b.classList.add("correct");else if(i===selected.choice)b.classList.add("wrong");}
  b.addEventListener("click",()=>choose(i));$("options").appendChild(b);
 });
 $("feedback").className="feedback";$("feedback").textContent="";
 if(checked){const good=selected.choice===q.answer;$("feedback").className="feedback show "+(good?"good":"bad");$("feedback").innerHTML=`<b>${good?"정답이에요! ✓":"아쉬워요. 정답을 확인해 보세요."}</b>${q.explain}`;}
 $("prevBtn").disabled=index===0;
 $("checkBtn").classList.toggle("hidden",checked);$("checkBtn").disabled=selected===null;
 $("nextBtn").classList.toggle("hidden",!checked);$("nextBtn").textContent=index===questions.length-1?"결과 보기 →":"다음 문제 →";
 $("nextBtn").disabled=!checked;
}
function choose(i){if(checked)return;selected={choice:i,checked:false};answers[index]=selected;render();}
function check(){if(selected===null)return;selected.checked=true;answers[index]=selected;checked=true;render();}
function next(){if(!checked)return;if(index<questions.length-1){index++;render();}else finish();}
function prev(){if(index>0){index--;render();}}
function finish(){
 const correct=answers.filter((a,i)=>a&&a.choice===questions[i].answer).length;
 $("scoreNum").textContent=correct;$("correctNum").textContent=correct;$("wrongNum").textContent=questions.length-correct;$("percentNum").textContent=Math.round(correct/questions.length*100)+"%";
 $("resultTitle").textContent=correct>=18?"완벽에 가까워요!":correct>=14?"좋은 결과예요!":correct>=10?"조금만 더 복습해 봐요!":"핵심 개념을 다시 확인해 봐요!";
 $("resultMessage").textContent=correct>=14?"개념을 잘 이해하고 있어요. 오답 해설도 확인해 보세요.":"틀린 문제의 해설을 읽고 다시 도전해 보세요.";
 $("reviewList").innerHTML="";
 questions.forEach((q,i)=>{
  const a=answers[i],good=a&&a.choice===q.answer;
  const item=document.createElement("div");item.className="review-item";
  const title=document.createElement("b");title.textContent=`Q${i+1}. ${q.q}`;
  const result=document.createElement("p");result.className=good?"right-answer":"wrong-answer";result.textContent=`${good?"정답":"오답"} · 내 답: ${a?String.fromCharCode(65+a.choice)+". "+q.options[a.choice]:"미응답"} · 정답: ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}`;
  const explain=document.createElement("p");explain.textContent=q.explain;
  item.append(title,result,explain);$("reviewList").appendChild(item);
 });
 show("result");window.scrollTo({top:0,behavior:"smooth"});
}
$("startBtn").addEventListener("click",start);$("checkBtn").addEventListener("click",check);$("nextBtn").addEventListener("click",next);$("prevBtn").addEventListener("click",prev);$("retryBtn").addEventListener("click",()=>{show("intro");window.scrollTo({top:0,behavior:"smooth"});});
</script>
</body></html>
